name: ReviveDiff_test
suffix: ~
model: denoising
distortion: adverse_weather
gpu_ids: [0]

sde:
  max_sigma: 90
  T: 300
  schedule: cosine
  eps: 0.005

degradation:
  sigma: 25
  noise_type: G
  scale: 4

datasets:
  test:
    name: Test_Dataset
    mode: LQGT
    dataroot_GT: datasets/rain100L/test/target
    dataroot_LQ: datasets/rain100L/test/input
    retinex_method: msrcr
    retinex_on_train: true

network_G:
  which_model_G: ConditionalNAFNet
  setting:
    width: 64
    cond_channels: 9   # 3 (LQ) + 3 (R) + 3 (I) = 9
    enc_blk_nums: [1, 1, 1, 28]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]

path:
  pretrain_model_G: ~   # 方案B训练后用 train checkpoint 推理
  strict_load: false    # intro 层不同 (12ch vs 6ch)
